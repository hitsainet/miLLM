# Redis — cache / real-time state. hostPath storage (no PVC).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: millm
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          hostPath:
            path: /data/millm/redis
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: millm
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
