# Renders the reference OpenTelemetry receiver ALONE (namespace miserver-otel): the Collector, the
# backend, the volume, the dashboard and the internal-host Ingress. Nothing of miServer's own
# deployment is here.
#
# Deployed only by the `miserver-otel` ArgoCD Application (k8s/argocd/miserver-otel-app.yaml), which the
# operator applies once by hand. See k8s/components/otel-reference/kustomization.yaml.
#
#   kubectl kustomize k8s/overlays/otel-reference      # render and inspect; applies nothing
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: miserver-otel

components:
  - ../../components/otel-reference
