apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      nodeSelector:
        kubernetes.io/hostname: mcs-lnxgpu01
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ENV
              value: dev
            # Secret lives ONLY in the cluster (k8s/ syncs to the public
            # mirror): kubectl create secret generic open-webui-env
            #   -n open-webui-ns --from-literal=WEBUI_SECRET_KEY=...
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-env
                  key: WEBUI_SECRET_KEY
            - name: WEBUI_AUTH
              value: "False"
            - name: OPENAI_API_BASE_URL
              value: http://192.168.224.222/v1
            - name: OPENAI_API_KEY
              value: sk-dummy-key
            - name: ENABLE_OLLAMA_API
              value: "False"
            - name: ENABLE_OPENAI_API
              value: "True"
            - name: DEFAULT_MODELS
              value: gemma-2-2b
            - name: DEFAULT_USER_ROLE
              value: admin
            - name: ENABLE_SIGNUP
              value: "True"
            - name: WEBUI_URL
              value: https://webui.hitsai.net
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - mountPath: /app/backend/data
              name: open-webui-volume
      volumes:
        - name: open-webui-volume
          persistentVolumeClaim:
            claimName: open-webui-pvc
