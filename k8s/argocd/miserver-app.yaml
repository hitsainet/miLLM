# ArgoCD GitOps definition for miServer (renamed from `millm` in the 040 P2 window).
#
# Apply once by hand (kubectl apply -f k8s/argocd/miserver-app.yaml); ArgoCD
# manages the workloads from then on. In the P2 window the Applications are first
# applied with automation stripped and synced in steps, then this file is re-applied
# to restore it (S001 runbook 2.44–2.48).
#
# Flow (mirrors the WASAT services):
#   push to Onegaishimas/miServer main
#     → sync-main-to-gitops-pilot.yml merges main → gitops/pilot
#     → sync-to-clean.yml mirrors main → hitsainet/miServer
#     → docker-images.yml (hitsainet) builds ONLY the changed images
#     → ArgoCD Image Updater sees the new :latest digest on Docker Hub,
#       commits a pin to gitops/pilot (.argocd-source-miserver.yaml)
#     → ArgoCD syncs k8s/base from gitops/pilot and rolls the deployment
#
# One-time prerequisites (not in git):
#   1. miserver-secrets Secret in the miserver namespace
#      (POSTGRES_PASSWORD, DATABASE_URL — see k8s/base/postgres.yaml header;
#      in the P2 window it is copied by hand from the old namespace's millm-secrets, same data)
#   2. Repo credential Secret in the argocd namespace for
#      https://github.com/Onegaishimas/miServer.git with a PAT that has
#      contents:write (Image Updater pushes pins through it), labeled
#      argocd.argoproj.io/secret-type: repository
#   3. gitops/pilot branch created from main
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: miserver
  namespace: argocd
spec:
  description: miServer — mechanistic interpretability LLM server
  sourceRepos:
    - https://github.com/Onegaishimas/miServer.git
  destinations:
    - namespace: miserver
      server: https://kubernetes.default.svc
    # 040 P7 (FR-040.40) removed the second destination, the old namespace that held the
    # transition ExternalName Service (PD-7, P2 to P7).
  clusterResourceWhitelist:
    # Namespace object is part of k8s/base.
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: miserver
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: miserver
  annotations:
    # ── ArgoCD Image Updater ────────────────────────────────────────────
    # Track :latest by digest (same strategy as the WASAT apps): every new
    # push of hitsai/miserver-*:latest to Docker Hub gets pinned by digest and
    # committed to gitops/pilot, which ArgoCD then syncs. (From P1 to P7 CI also pushed every
    # image to the old-brand Docker Hub repositories; since P7 it pushes to hitsai/miserver-* only.)
    argocd-image-updater.argoproj.io/image-list: backend=docker.io/hitsai/miserver-backend:latest, admin-ui=docker.io/hitsai/miserver-admin-ui:latest
    argocd-image-updater.argoproj.io/backend.update-strategy: digest
    argocd-image-updater.argoproj.io/backend.kustomize.image-name: hitsai/miserver-backend
    argocd-image-updater.argoproj.io/admin-ui.update-strategy: digest
    argocd-image-updater.argoproj.io/admin-ui.kustomize.image-name: hitsai/miserver-admin-ui
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: gitops/pilot
    # Default write-back target: parameter-override file
    # k8s/base/.argocd-source-miserver.yaml (kept off main; the
    # sync-main-to-gitops-pilot workflow preserves it during merges).
spec:
  project: miserver
  source:
    repoURL: https://github.com/Onegaishimas/miServer.git
    targetRevision: gitops/pilot
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: miserver
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      selfHeal: true
      # prune intentionally NOT enabled yet — enable after a burn-in period
      # once adoption of the pre-existing resources is proven stable.
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    # Tolerate kubectl rollout restart / set env during incident response
    # without a self-heal fight over the restartedAt annotation.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
---
# This cluster runs the CRD-based Image Updater: applications are reconciled
# only when selected by an ImageUpdater resource (see wasat-pilot-images for
# the WASAT services). useAnnotations pulls the per-image configuration from
# the Application annotations above.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: miserver-images
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: miserver
      useAnnotations: true
  commonUpdateSettings:
    forceUpdate: false
    pullSecret: pullsecret:argocd/regcred
    updateStrategy: digest
  writeBackConfig:
    method: git
    gitConfig:
      branch: gitops/pilot
      # No writeBackTarget: the default parameter-override file
      # (k8s/base/.argocd-source-miserver.yaml) is used for this Kustomize app.
