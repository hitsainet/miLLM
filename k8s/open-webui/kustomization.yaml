apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: open-webui-ns
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# Baseline release only. On gitops/pilot the nightly owui-release-check
# workflow overrides this via .argocd-source-open-webui.yaml, so every
# upstream release rolls out automatically — do not hand-bump to chase
# releases.
images:
  - name: ghcr.io/open-webui/open-webui
    newTag: v0.12.0
