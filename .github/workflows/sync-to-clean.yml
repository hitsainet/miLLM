name: Sync to Clean Repository

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # ── THE MIRROR TRUSTS THIS REPOSITORY'S CI (operator directive, 2026-10-20) ────────────
  # The mirror's image build used to wait for the MIRROR's own Backend Tests run (dispatched
  # by this sync) - the same suite, run a second time on the same code. It now only checks
  # that the snapshot carries the `Private-CI: passed` trailer the `sync` job below writes,
  # so nothing may be published until every CI workflow that runs on main HERE has passed
  # for the exact commit. `.github/scripts/private_ci_gate.py` decides (its docstring gives
  # the rules: Backend Tests' `all-shards` aggregator, and - because backend-tests.yml and
  # frontend-ci.yml carry `paths:` filters - a fallback to a passing ANCESTOR whose tested
  # paths are byte-identical, the rule the mirror's old gate applied).
  # tests/unit/test_private_ci_trust.py pins this wiring from the parsed YAML.
  gate:
    name: Require private CI to have passed
    if: github.repository == 'Onegaishimas/miLLM'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read     # list this commit's workflow runs and their jobs
      contents: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    env:
      REQUIRED_WORKFLOWS: |
        backend-tests.yml
        frontend-ci.yml
    steps:
      - name: Checkout source repository (full history, for the path-filter fallback)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the gate's one dependency
        run: pip install pyyaml==6.0.3

      - name: Require private CI to have passed for this commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: python .github/scripts/private_ci_gate.py

  sync:
    needs: gate
    # HARD STOP: only run in Onegaishimas/miLLM (private repo)
    if: github.repository == 'Onegaishimas/miLLM'

    runs-on: ubuntu-latest

    # ONE SYNC AT A TIME, IN ORDER. Each sync now waits for its commit's CI, so two pushes
    # minutes apart can finish their gates out of order. Queued syncs run one by one (a newer
    # queued sync replaces an older queued one), and "Never move the mirror backwards"
    # refuses to publish a commit older than the one the mirror already holds.
    concurrency:
      group: sync-to-clean-mirror
      cancel-in-progress: false

    env:
      MIRROR: hitsainet/millm

    steps:
      # CHANGED 2026-10-20: this was `ref: main` ("always check out main, even when
      # triggered by a tag"). With the gate in front, main may have moved on to a commit
      # whose CI has not passed, so the sync publishes EXACTLY the commit the gate passed:
      # the pushed head, or for a tag the tagged commit (which is main's head when a
      # release is cut the usual way).
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.gate.outputs.sha }}

      # A branch sync publishes only if its commit is the private main's current head, or
      # is at or ahead of the commit the mirror already holds (its Source-Commit trailer).
      # Tag syncs are exempt, as their snapshot behaviour was before.
      - name: Never move the mirror backwards
        id: order
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_TOKEN: ${{ secrets.HITSAINET_SYNC }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          HEAD_NOW="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          MSG="$(GH_TOKEN="${SYNC_TOKEN}" gh api "repos/${MIRROR}/commits/main" --jq .commit.message 2>/dev/null || true)"
          PUBLISHED="$(git interpret-trailers --parse <<< "$MSG" | sed -n '/^Source-Commit: /{s///p;q;}')"
          if [ "$SHA" = "$HEAD_NOW" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "${SHA} is main's head - publishing."
          elif [ -z "$PUBLISHED" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "The mirror records no Source-Commit yet - publishing."
          else
            STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PUBLISHED}...${SHA}" --jq .status)"
            case "$STATUS" in
              ahead|identical)
                echo "publish=true" >> "$GITHUB_OUTPUT"; echo "${SHA} is ${STATUS} of the published ${PUBLISHED} - publishing." ;;
              *)
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Not publishing ${SHA}: it is ${STATUS} relative to the mirror's ${PUBLISHED}, and main has moved on to ${HEAD_NOW}." ;;
            esac
          fi

      # NO ref_type gate, deliberately: a tag push must apply the exclusions too.
      # Gating this to branches (as it was before 2026-10-13) would skip the exclusions
      # on a tag push and publish an orphan snapshot that still CONTAINS 0xcc/.
      - name: Remove excluded files and folders
        if: steps.order.outputs.publish != 'false'
        run: |
          # Remove development/private files
          rm -rf 0xcc/
          rm -rf .claude/
          rm -f CLAUDE.md
          rm -rf backups/
          # docs/ is dev-internal EXCEPT the vendored interchange contract:
          # docs/schemas/cluster-definition-v1.json is the frozen public
          # mistudio.cluster-definition/v1 schema — the schema-sync test
          # (and consumers of the public repo) need it, so preserve it.
          find docs/ -mindepth 1 -maxdepth 1 ! -name schemas -exec rm -rf {} +
          rm -rf scripts/
          # Remove any other development artifacts
          rm -rf .vscode/
          rm -rf *.log
          echo "Removed excluded files"

      # CHANGED 2026-10-13 — this workflow used to `git add -A`, commit the
      # deletions on top of main, and `git push --force main`. That publishes
      # the ENTIRE private history plus one deletion commit, so every excluded
      # file stays reachable at HEAD~1 and earlier on the PUBLIC mirror. A clone
      # of hitsainet/millm on 2026-10-13 had 698 commits with 637 file-commits
      # touching `0xcc/`. miStudio leaked a password and database dumps exactly
      # this way (its MIS-E2E-143); miForge was built with the orphan pattern to
      # avoid it. This is that pattern, copied from miForge.
      #
      # `git checkout --orphan` creates a commit with NO PARENTS, so nothing
      # excluded is reachable from the published ref at all.
      - name: Build the orphan snapshot
        if: steps.order.outputs.publish != 'false'
        env:
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git checkout --orphan clean
          git add -A
          # The trailers are what the mirror's image build checks (docker-images.yml, job
          # `private-ci`): the source commit, and that the `gate` job passed its CI.
          git commit -m "miLLM — filtered snapshot from ${SOURCE_SHA::7}" \
            --trailer "Source-Commit: ${SOURCE_SHA}" --trailer "Private-CI: passed"

          PARENTS="$(git rev-list --parents -n1 HEAD | wc -w)"
          if [ "$PARENTS" -ne 1 ]; then
            echo "::error::orphan commit has parents — refusing to push"
            exit 1
          fi
          echo "Built orphan snapshot: $(git rev-parse --short HEAD)"

      - name: Push to clean repository
        if: steps.order.outputs.publish != 'false'
        env:
          SYNC_TOKEN: ${{ secrets.HITSAINET_SYNC }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN}" ]; then
            echo "::error::HITSAINET_SYNC is not set on this repo, so nothing can be pushed"
            exit 1
          fi
          git config --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader || true

          REMOTE="https://x-access-token:${SYNC_TOKEN}@github.com/${MIRROR}.git"
          git push --force "$REMOTE" clean:main

          # Tags must point at the orphan, never the source commit: pushing a
          # source tag pushes that commit AND its ancestors, reintroducing the
          # history the snapshot exists to exclude.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            git tag -f "$TAG" HEAD
            git push --force "$REMOTE" "refs/tags/${TAG}"
            echo "Tagged the orphan snapshot as ${TAG}"
          fi

          # Retarget stale tags: any other ref keeps old commits reachable, and
          # a clone then fetches the whole history back. This is what makes the
          # fix retroactive — existing v* tags on the mirror currently anchor
          # all 698 commits. `|| true` because grep -v on empty input exits 1.
          for ref in $(git ls-remote --tags "$REMOTE" | awk '{print $2}' | grep -v '\^{}$' || true); do
            T="${ref#refs/tags/}"
            git tag -f "$T" HEAD
            git push --force "$REMOTE" "refs/tags/${T}"
            echo "Retargeted stale tag ${T} onto the snapshot"
          done

      # The mirror receives an orphan snapshot (one commit, force-pushed), so a `paths:` filter there has
      # no diff base and matches nothing; this dispatch is the only way Backend Tests runs there. Since
      # 2026-10-20 NOTHING WAITS ON IT - the image build trusts this repo's CI (the `gate` job) - so it
      # is informational: the one check that the STRIPPED snapshot is self-consistent (a test reading a
      # file the sync removes). A failed dispatch therefore warns instead of failing the sync.
      - name: Dispatch Backend Tests on the mirror
        if: github.ref_type == 'branch' && steps.order.outputs.publish != 'false'
        env:
          SYNC_TOKEN: ${{ secrets.HITSAINET_SYNC }}
        run: |
          set -euo pipefail
          code="$(curl -sS -X POST \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${MIRROR}/actions/workflows/backend-tests.yml/dispatches" \
            -d '{"ref":"main"}' -w '%{http_code}' -o /dev/null)"
          echo "dispatch Backend Tests on ${MIRROR}: HTTP ${code}"
          [ "$code" = "204" ] || echo "::warning::dispatch failed (HTTP ${code}); the mirror's informational Backend Tests did not start"


      # The check whose absence let MIS-E2E-143 run unnoticed for months: clone
      # the PUBLISHED result and assert the exclusions hold in every commit.
      - name: Verify the published mirror
        if: steps.order.outputs.publish != 'false'
        env:
          SYNC_TOKEN: ${{ secrets.HITSAINET_SYNC }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${SYNC_TOKEN}@github.com/${MIRROR}.git"
          rm -rf /tmp/verify
          git clone --quiet "$REMOTE" /tmp/verify
          cd /tmp/verify

          FAILED=0

          # --all covers tags too: a tag on old history keeps it reachable even
          # when main is a clean orphan.
          COMMITS="$(git rev-list --all --count)"
          echo "Published commits: ${COMMITS}"
          if [ "$COMMITS" -ne 1 ]; then
            echo "::error::mirror has ${COMMITS} commits; a snapshot must have exactly 1"
            echo "::error::a ref other than main is probably anchoring old history:"
            git show-ref | sed 's/^/    /'
            FAILED=1
          fi

          for p in 0xcc .claude CLAUDE.md backups scripts .vscode; do
            if [ -n "$(git log --all --oneline -- "$p" 2>/dev/null)" ]; then
              echo "::error::LEAK — '${p}' is present in published history"
              FAILED=1
            fi
          done

          # The verdict the mirror's image build requires (docker-images.yml, `private-ci`).
          TRAILERS="$(git log -1 --format='%(trailers:only,unfold)' HEAD)"
          if ! grep -qx "Source-Commit: ${{ needs.gate.outputs.sha }}" <<< "$TRAILERS" \
             || ! grep -qx "Private-CI: passed" <<< "$TRAILERS"; then
            echo "::error::the published snapshot lacks its Source-Commit / Private-CI trailers;"
            echo "::error::the mirror's image build will refuse it"
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::published mirror failed verification"
            exit 1
          fi
          echo "Mirror verified: 1 commit, no excluded path in any commit"
