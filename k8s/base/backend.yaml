# miLLM backend — GPU inference server.
# The image tag/digest is managed by ArgoCD Image Updater (kustomize images
# transform + .argocd-source-millm.yaml pin file); do not hand-edit tags here.
#
# DATABASE_URL comes from the `millm-secrets` Secret (see postgres.yaml header).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: millm-backend
  namespace: millm
spec:
  replicas: 1
  # Recreate: only one GPU — the old pod must release VRAM before the new one
  # loads the model.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: millm-backend
  template:
    metadata:
      labels:
        app: millm-backend
    spec:
      # Pin to the GPU node.
      nodeSelector:
        kubernetes.io/hostname: mcs-lnxgpu01
      # Cluster nodes cannot resolve the .local ingress hostname via DNS.
      hostAliases:
        - ip: "192.168.244.61"
          hostnames:
            - "k8s-millm.hitsai.local"
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command: ["sh", "-c", "mkdir -p /data/model_cache /data/sae_cache /data/hf_cache && chown -R 1000:1000 /data"]
          volumeMounts:
            - name: millm-data
              mountPath: /data
      containers:
        - name: backend
          image: hitsai/millm-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: millm-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: MODEL_CACHE_DIR
              value: "/data/model_cache"
            - name: SAE_CACHE_DIR
              value: "/data/sae_cache"
            - name: HF_HOME
              value: "/data/hf_cache"
            - name: CORS_ORIGINS
              value: "https://millm.hitsai.net,http://k8s-millm.hitsai.local,http://k8s-millm.hitsai.net,http://localhost:3000"
            - name: LOG_LEVEL
              value: "INFO"
            - name: LOG_FORMAT
              value: "json"
            - name: DEBUG
              value: "false"
            - name: TORCH_COMPILE
              # Re-enabled 2026-07-27 only after the three things that made the
              # earlier outage possible were fixed:
              #
              #   1. the compile MODE. It was "reduce-overhead", which turns on
              #      CUDA Graphs; every request after the first then died with
              #      "accessing tensor output of CUDAGraphs that has been
              #      overwritten by a subsequent run". Now "default" — no graphs.
              #
              #   2. the WARMUP. It was one uncached seq_len=1 forward, which
              #      does not resemble decoding and would not have caught the
              #      fault even if repeated. It is now a 3-pass soak through
              #      cached generate(), reading each result back — the fault
              #      raises on ACCESS, not on the call.
              #
              #   3. the FAILURE MODE. A failed warmup used to leave the
              #      compiled forward installed, so the server kept returning
              #      500. The soak now restores the uncompiled forward and logs
              #      torch_compile_soak_failed_reverted_to_eager. Worst case is
              #      slower, not down.
              #
              # Still a no-op under bitsandbytes quantization — model_loader
              # guards that separately, so this only bites on fp16/bf16 loads.
              value: "true"
            # Batch concurrent requests into single forward passes. Without it
            # the server serialises: measured 4 sequential calls 2.9s vs 4
            # concurrent 3.0s — a 0.96x "speedup", i.e. no concurrency at all.
            # Bulk work (labeling 32k features) is the main beneficiary.
            # Caveat from ContinuousBatchingBackend: per-request sampling params
            # are fixed at manager creation; only max_new_tokens varies. Labeling
            # uses temperature 0 throughout, so this is not a constraint there.
            - name: ENABLE_CONTINUOUS_BATCHING
              value: "true"
            # Bring the served model back after a restart.
            #
            # Without this the pod comes up serving NOTHING: main.py resets every
            # 'loaded'/'loading' row to 'ready' on startup (the status is process
            # state, not durable state), and only AUTO_LOAD_MODEL reloads one.
            # Every deploy therefore silently took inference offline until a human
            # noticed and re-loaded an 8B model by hand.
            #
            # The dtype is NOT pinned here: load_model() passes the model row's
            # own `quantization`, so this reloads whatever was last configured
            # (currently FP16) rather than overriding an operator's choice.
            - name: AUTO_LOAD_MODEL
              value: "granite-4.1-8b"
          volumeMounts:
            - name: millm-data
              mountPath: /data
          resources:
            limits:
              nvidia.com/gpu: 1
      volumes:
        - name: millm-data
          hostPath:
            path: /data/millm/data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: millm-backend
  namespace: millm
spec:
  selector:
    app: millm-backend
  ports:
    - port: 8000
      targetPort: 8000
