name: Validate manual build

on:
  pull_request:
    branches: [main]
    paths:
      - 'manual/**'
      - '.github/workflows/manual-pr-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: manual/package-lock.json
      - name: Install dependencies
        working-directory: manual
        run: npm ci
      - name: Build Docusaurus site
        working-directory: manual
        run: npm run build
