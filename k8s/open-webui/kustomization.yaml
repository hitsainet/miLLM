apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: open-webui-ns
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# Pinned by ArgoCD Image Updater (digest strategy on the :latest tag) —
# every upstream Open WebUI release rolls out automatically.
images:
  - name: ghcr.io/open-webui/open-webui
    newTag: latest
