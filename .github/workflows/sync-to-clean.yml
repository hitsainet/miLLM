name: Sync to Clean Repository

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  sync:
    # HARD STOP: only run in Onegaishimas/miLLM (private repo)
    if: github.repository == 'Onegaishimas/miLLM'

    runs-on: ubuntu-latest

    env:
      MIRROR: hitsainet/millm

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main  # Always check out main branch, even when triggered by a tag

      # NO ref_type gate, deliberately: the checkout is always `ref: main`, so a
      # tag build snapshots main's content and tags it. Gating this to branches
      # (as it was before 2026-10-13) would skip the exclusions on a tag push and
      # publish an orphan snapshot that still CONTAINS 0xcc/.
      - name: Remove excluded files and folders
        run: |
          # Remove development/private files
          rm -rf 0xcc/
          rm -rf .claude/
          rm -f CLAUDE.md
          rm -rf backups/
          # docs/ is dev-internal EXCEPT the vendored interchange contract:
          # docs/schemas/cluster-definition-v1.json is the frozen public
          # mistudio.cluster-definition/v1 schema — the schema-sync test
          # (and consumers of the public repo) need it, so preserve it.
          find docs/ -mindepth 1 -maxdepth 1 ! -name schemas -exec rm -rf {} +
          rm -rf scripts/
          # Remove any other development artifacts
          rm -rf .vscode/
          rm -rf *.log
          echo "Removed excluded files"

      # CHANGED 2026-10-13 — this workflow used to `git add -A`, commit the
      # deletions on top of main, and `git push --force main`. That publishes
      # the ENTIRE private history plus one deletion commit, so every excluded
      # file stays reachable at HEAD~1 and earlier on the PUBLIC mirror. A clone
      # of hitsainet/millm on 2026-10-13 had 698 commits with 637 file-commits
      # touching `0xcc/`. miStudio leaked a password and database dumps exactly
      # this way (its MIS-E2E-143); miForge was built with the orphan pattern to
      # avoid it. This is that pattern, copied from miForge.
      #
      # `git checkout --orphan` creates a commit with NO PARENTS, so nothing
      # excluded is reachable from the published ref at all.
      - name: Build the orphan snapshot
        run: |
          set -euo pipefail
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git checkout --orphan clean
          git add -A
          git commit -m "miLLM — filtered snapshot from ${GITHUB_SHA::7}"

          PARENTS="$(git rev-list --parents -n1 HEAD | wc -w)"
          if [ "$PARENTS" -ne 1 ]; then
            echo "::error::orphan commit has parents — refusing to push"
            exit 1
          fi
          echo "Built orphan snapshot: $(git rev-parse --short HEAD)"

      - name: Push to clean repository
        env:
          SYNC_TOKEN: ${{ secrets.HITSAINET_SYNC }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN}" ]; then
            echo "::error::HITSAINET_SYNC is not set on this repo, so nothing can be pushed"
            exit 1
          fi
          git config --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader || true

          REMOTE="https://x-access-token:${SYNC_TOKEN}@github.com/${MIRROR}.git"
          git push --force "$REMOTE" clean:main

          # Tags must point at the orphan, never the source commit: pushing a
          # source tag pushes that commit AND its ancestors, reintroducing the
          # history the snapshot exists to exclude.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            git tag -f "$TAG" HEAD
            git push --force "$REMOTE" "refs/tags/${TAG}"
            echo "Tagged the orphan snapshot as ${TAG}"
          fi

          # Retarget stale tags: any other ref keeps old commits reachable, and
          # a clone then fetches the whole history back. This is what makes the
          # fix retroactive — existing v* tags on the mirror currently anchor
          # all 698 commits. `|| true` because grep -v on empty input exits 1.
          for ref in $(git ls-remote --tags "$REMOTE" | awk '{print $2}' | grep -v '\^{}$' || true); do
            T="${ref#refs/tags/}"
            git tag -f "$T" HEAD
            git push --force "$REMOTE" "refs/tags/${T}"
            echo "Retargeted stale tag ${T} onto the snapshot"
          done

      # The mirror receives an orphan snapshot (one commit, force-pushed), so a `paths:` filter there has
      # no diff base and matches nothing: Backend Tests never ran on the mirror after 2026-10-13, and the
      # image build's gate ("Require Backend Tests to have passed for this commit") then refused the first
      # backend change (2026-10-16, e142853). Dispatch it explicitly, on branch pushes only (a tag push
      # snapshots the same tree). The primary keeps its path filter.
      - name: Dispatch Backend Tests on the mirror
        if: github.ref_type == 'branch'
        env:
          SYNC_TOKEN: ${{ secrets.HITSAINET_SYNC }}
        run: |
          set -euo pipefail
          code="$(curl -sS -X POST \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${MIRROR}/actions/workflows/backend-tests.yml/dispatches" \
            -d '{"ref":"main"}' -w '%{http_code}' -o /dev/null)"
          echo "dispatch Backend Tests on ${MIRROR}: HTTP ${code}"
          [ "$code" = "204" ] || { echo "::error::dispatch failed (HTTP ${code}); the backend image gate will refuse"; exit 1; }

      # The check whose absence let MIS-E2E-143 run unnoticed for months: clone
      # the PUBLISHED result and assert the exclusions hold in every commit.
      - name: Verify the published mirror
        env:
          SYNC_TOKEN: ${{ secrets.HITSAINET_SYNC }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${SYNC_TOKEN}@github.com/${MIRROR}.git"
          rm -rf /tmp/verify
          git clone --quiet "$REMOTE" /tmp/verify
          cd /tmp/verify

          FAILED=0

          # --all covers tags too: a tag on old history keeps it reachable even
          # when main is a clean orphan.
          COMMITS="$(git rev-list --all --count)"
          echo "Published commits: ${COMMITS}"
          if [ "$COMMITS" -ne 1 ]; then
            echo "::error::mirror has ${COMMITS} commits; a snapshot must have exactly 1"
            echo "::error::a ref other than main is probably anchoring old history:"
            git show-ref | sed 's/^/    /'
            FAILED=1
          fi

          for p in 0xcc .claude CLAUDE.md backups scripts .vscode; do
            if [ -n "$(git log --all --oneline -- "$p" 2>/dev/null)" ]; then
              echo "::error::LEAK — '${p}' is present in published history"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::published mirror failed verification"
            exit 1
          fi
          echo "Mirror verified: 1 commit, no excluded path in any commit"
