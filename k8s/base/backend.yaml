# miLLM backend — GPU inference server.
# The image tag/digest is managed by ArgoCD Image Updater (kustomize images
# transform + .argocd-source-millm.yaml pin file); do not hand-edit tags here.
#
# DATABASE_URL comes from the `millm-secrets` Secret (see postgres.yaml header).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: millm-backend
  namespace: millm
spec:
  replicas: 1
  # Recreate: only one GPU — the old pod must release VRAM before the new one
  # loads the model.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: millm-backend
  template:
    metadata:
      labels:
        app: millm-backend
    spec:
      # Pin to the GPU node.
      nodeSelector:
        kubernetes.io/hostname: mcs-lnxgpu01
      # Cluster nodes cannot resolve the .local ingress hostname via DNS.
      hostAliases:
        - ip: "192.168.244.61"
          hostnames:
            - "k8s-millm.hitsai.local"
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command: ["sh", "-c", "mkdir -p /data/model_cache /data/sae_cache /data/hf_cache && chown -R 1000:1000 /data"]
          volumeMounts:
            - name: millm-data
              mountPath: /data
      containers:
        - name: backend
          image: hitsai/millm-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: millm-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: MODEL_CACHE_DIR
              value: "/data/model_cache"
            - name: SAE_CACHE_DIR
              value: "/data/sae_cache"
            - name: HF_HOME
              value: "/data/hf_cache"
            - name: CORS_ORIGINS
              value: "https://millm.hitsai.net,http://k8s-millm.hitsai.local,http://k8s-millm.hitsai.net,http://localhost:3000"
            - name: LOG_LEVEL
              value: "INFO"
            - name: LOG_FORMAT
              value: "json"
            - name: DEBUG
              value: "false"
            - name: TORCH_COMPILE
              # OFF until the image carrying the compile-safety code is LIVE.
              #
              # SEQUENCING, learned the hard way: the manifest and the image
              # deploy on DIFFERENT timelines. A gitops sync lands in seconds;
              # the image takes ~12 minutes to build. Enabling this in the same
              # commit as the code that makes it safe ran the OLD code with the
              # flag on — which is exactly the outage combination. Re-enable in
              # a SEPARATE commit, after confirming the running image contains
              # the soak and the revert-to-eager.
              #
              # WHY IT NEEDS THAT CODE: model_loader used to compile with
              # mode="reduce-overhead", which enables CUDA Graphs. Compilation
              # and warmup both succeeded, then every subsequent request died
              # with "accessing tensor output of CUDAGraphs that has been
              # overwritten by a subsequent run". The fault only shows on the
              # SECOND cached generate, so nothing at startup revealed it.
              # The fix is three parts: mode="default", a multi-pass soak
              # through cached generate() that reads its output, and a revert
              # to the uncompiled forward when that soak fails.
              #
              # ALSO: this is silently skipped under bitsandbytes quantization
              # (model_loader guards it separately), so it only ever takes
              # effect on fp16/bf16 loads — it was a no-op the whole time
              # granite ran in Q4.
              value: "false"
            # DISABLED 2026-07-27 after measuring it on hardware. It was
            # enabled on a prediction; the measurement did not support it.
            #
            # Once actually running (the manager had never started before —
            # see the signature fix), on an idle box, fp16 granite-4.1-8b:
            #
            #   single-stream    30.6 tok/s   vs 33.8 serial  (-9.5%)
            #   concurrency 2-4  RuntimeError: Generation timed out after 300s
            #   after a timeout  EVERY request fails instantly — the manager
            #                    wedges and does not recover
            #
            # So it costs throughput on the common case, fails the case it
            # exists for, and turns a slow request into a total outage. The
            # serial queue is slower in theory and correct in practice.
            #
            # The integration itself is now sound (adaptive signature, sampling
            # aligned to temperature 0). What is not sound is transformers
            # 5.14.1's ContinuousBatchingManager under concurrent load on this
            # hardware. Re-enabling needs that timeout root-caused first, and a
            # concurrency soak before it goes anywhere near production.
            - name: ENABLE_CONTINUOUS_BATCHING
              value: "false"
            # Bring the served model back after a restart.
            #
            # Without this the pod comes up serving NOTHING: main.py resets every
            # 'loaded'/'loading' row to 'ready' on startup (the status is process
            # state, not durable state), and only AUTO_LOAD_MODEL reloads one.
            # Every deploy therefore silently took inference offline until a human
            # noticed and re-loaded an 8B model by hand.
            #
            # The dtype is NOT pinned here: load_model() passes the model row's
            # own `quantization`, so this reloads whatever was last configured
            # (currently FP16) rather than overriding an operator's choice.
            - name: AUTO_LOAD_MODEL
              value: "granite-4.1-8b"
          volumeMounts:
            - name: millm-data
              mountPath: /data
          resources:
            limits:
              nvidia.com/gpu: 1
      volumes:
        - name: millm-data
          hostPath:
            path: /data/millm/data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: millm-backend
  namespace: millm
spec:
  selector:
    app: millm-backend
  ports:
    - port: 8000
      targetPort: 8000
